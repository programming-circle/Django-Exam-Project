{% block card %}
<div class="container" style="margin-top: 20px;">
    <h1>Our automobiles:</h1>
    <div class="row">
        {% if cars %}
            {% for p in cars %}
                <div class="col s12 m6 l4">
                    <div class="card">
                        <div class="card-image waves-effect waves-block waves-light">
                            <img class="activator" src={{p.image}} alt="{{ p.name }}"> <!--Here is card get name and image.-->
                        </div>
                        
                        <div class="card-content">
                            <span class="card-title activator grey-text text-darken-4">
                                <strong>{{ p.name }}</strong>
                                <i class="material-icons right">more_vert</i>
                            </span>
                            <p><b>Price:</b> {{ p.price }}$</p>
                            <br>
                            <p><a href="{% url 'card_site' slug=p.slug %}" class="btn blue waves-effect waves-light">View details</a></p>
                        </div>
                        
                        <!-- Might be not need but left from materialize for things.
                            <div class="card-reveal">
                            <span class="card-title grey-text text-darken-4">
                                {{ p.name }}
                                <i class="material-icons right">close</i>
                            </span>
                            <p><b>Описание товара:</b></p>
                            <p>{{ p.description }}</p>
                        </div> -->
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="col s12">
                <p class="grey-text">No cars available.</p>
            </div>
        {% endif %}
    </div>
</div>
{% endblock card %}
